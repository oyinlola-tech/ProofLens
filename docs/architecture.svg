<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8A94"/></marker>
    <style>
      .box{fill:#FFFFFF;stroke:#D8D8D3;stroke-width:1.5;rx:12}
      .accent{fill:#FFF1EA;stroke:#E5502A}
      .t{fill:#17171A;font-size:15px;font-weight:600}
      .s{fill:#5C5C66;font-size:12px}
      .l{stroke:#8A8A94;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lbl{fill:#8A8A94;font-size:11px}
    </style>
  </defs>
  <rect width="960" height="520" fill="#F7F7F5"/>

  <rect class="box" x="40" y="40" width="200" height="72" rx="12"/>
  <text class="t" x="60" y="70">Web client</text>
  <text class="s" x="60" y="92">Next.js 16, apps/web</text>

  <rect class="box" x="720" y="40" width="200" height="72" rx="12"/>
  <text class="t" x="740" y="70">Mobile client</text>
  <text class="s" x="740" y="92">Expo SDK 57, apps/mobile</text>

  <rect class="box accent" x="330" y="150" width="300" height="72" rx="12"/>
  <text class="t" x="350" y="180">ProofLens API</text>
  <text class="s" x="350" y="202">FastAPI, src/app + src/modules, /api/v1</text>

  <rect class="box" x="40" y="280" width="200" height="60" rx="12"/>
  <text class="t" x="60" y="305">Auth + sessions</text>
  <text class="s" x="60" y="326">Argon2id, hashed tokens, email code</text>

  <rect class="box" x="270" y="280" width="200" height="60" rx="12"/>
  <text class="t" x="290" y="305">Claims + evidence</text>
  <text class="s" x="290" y="326">Ownership enforced per request</text>

  <rect class="box" x="500" y="280" width="200" height="60" rx="12"/>
  <text class="t" x="520" y="305">Document processing</text>
  <text class="s" x="520" y="326">PDF parsing, page boundaries</text>

  <rect class="box" x="730" y="280" width="190" height="60" rx="12"/>
  <text class="t" x="750" y="305">Verification engine</text>
  <text class="s" x="750" y="326">Rule checks, then validated AI</text>

  <rect class="box" x="180" y="420" width="260" height="60" rx="12"/>
  <text class="t" x="200" y="445">PostgreSQL</text>
  <text class="s" x="200" y="466">Users, claims, documents, pages, evidence, verifications</text>

  <rect class="box" x="520" y="420" width="260" height="60" rx="12"/>
  <text class="t" x="540" y="445">AI provider (server side only)</text>
  <text class="s" x="540" y="466">Gemini, NVIDIA NIM, Groq or Ollama; one interface</text>

  <path class="l" d="M140 112 L140 186 L330 186"/>
  <text class="lbl" x="150" y="150">httpOnly cookie, same-origin proxy</text>
  <path class="l" d="M820 112 L820 186 L630 186"/>
  <text class="lbl" x="640" y="150">Bearer token from SecureStore</text>

  <path class="l" d="M480 222 L480 250 L140 250 L140 280"/>
  <path class="l" d="M480 222 L480 250 L370 250 L370 280"/>
  <path class="l" d="M480 222 L480 250 L600 250 L600 280"/>
  <path class="l" d="M480 222 L480 250 L825 250 L825 280"/>

  <path class="l" d="M140 340 L140 390 L310 390 L310 420"/>
  <path class="l" d="M370 340 L370 390 L310 390"/>
  <path class="l" d="M600 340 L600 390 L310 390"/>
  <path class="l" d="M825 340 L825 390 L650 390 L650 420"/>
  <text class="lbl" x="660" y="405">controlled prompt: claim + passages only</text>
</svg>
