<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Worked example: causation claim against an associative source"><rect width="1200" height="560" rx="18" fill="#F7F7F5"/><text x="36" y="50" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E5502A" text-anchor="start"><tspan x="36" dy="0">WORKED EXAMPLE</tspan></text><text x="1164" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5C5C66" text-anchor="end"><tspan x="1164" dy="0">Condensed from a live run  ·  sample document, fictional data</tspan></text><rect x="36" y="80" width="340" height="200" rx="14" fill="#FFFFFF" stroke="#DEDED8"/><g transform="translate(58 100) scale(0.9166666666666666)" fill="none" stroke="#E5502A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v10H9l-5 4z"/><path d="M8 10h8M8 13h5"/></g><text x="90" y="117" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#5C5C66" text-anchor="start"><tspan x="90" dy="0">YOUR CLAIM</tspan></text><text x="58" y="160" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#17171A"><tspan x="58" dy="0">“The study <tspan fill="#E5502A" font-weight="700">proves</tspan> that</tspan><tspan x="58" dy="26.599999999999998">drinking coffee every day</tspan><tspan x="58" dy="26.599999999999998"><tspan fill="#E5502A" font-weight="700">causes</tspan> a lower risk of</tspan><tspan x="58" dy="26.599999999999998">heart disease.”</tspan></text><rect x="400" y="80" width="400" height="200" rx="14" fill="#FFFFFF" stroke="#DEDED8"/><g transform="translate(422 100) scale(0.9166666666666666)" fill="none" stroke="#3B63C8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 15h6M9 18h4"/></g><text x="454" y="117" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#5C5C66" text-anchor="start"><tspan x="454" dy="0">THE EVIDENCE  ·  coffee-heart-study-sample.pdf</tspan></text><text x="422" y="152" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#5C5C66" text-anchor="start"><tspan x="422" dy="0">Page 2 · Results</tspan></text><text x="422" y="174" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17171A"><tspan x="422" dy="0">“Daily coffee consumption was <tspan fill="#1F8F5B" font-weight="700">associated with</tspan></tspan><tspan x="422" dy="21.0">a lower risk of heart disease.”</tspan></text><text x="422" y="226" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#5C5C66" text-anchor="start"><tspan x="422" dy="0">Page 3 · Limitations</tspan></text><text x="422" y="248" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17171A"><tspan x="422" dy="0">“…the findings <tspan fill="#C9373C" font-weight="700">do not establish</tspan> that coffee causes</tspan><tspan x="422" dy="21.0">a lower risk of heart disease.”</tspan></text><path d="M812 180h24" stroke="#E5502A" stroke-width="2.4" stroke-linecap="round"/><path d="M830 173l8 7-8 7" fill="none" stroke="#E5502A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="850" y="80" width="314" height="200" rx="14" fill="#FFFFFF" stroke="#C9373C" stroke-width="1.6"/><text x="872" y="117" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#5C5C66" text-anchor="start"><tspan x="872" dy="0">VERDICT</tspan></text><rect x="872" y="134" width="150" height="34" rx="17" fill="#F0F0EC"/><text x="947" y="157" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#C9373C" text-anchor="middle"><tspan x="947" dy="0">Contradicted</tspan></text><text x="1040" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#C9373C" text-anchor="start"><tspan x="1040" dy="0">97%</tspan></text><text x="872" y="204" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5C5C66" text-anchor="start"><tspan x="872" dy="0">Rule checks, independent of the model:</tspan></text><text x="872" y="228" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#17171A" text-anchor="start"><tspan x="872" dy="0">Stronger language than the source</tspan><tspan x="872" dy="20.25">causation  vs  associated</tspan></text><rect x="36" y="304" width="364" height="170" rx="14" fill="#FFFFFF" stroke="#DEDED8"/><rect x="36" y="304" width="364" height="4" rx="2" fill="#3B63C8"/><text x="58" y="342" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3B63C8" text-anchor="start"><tspan x="58" dy="0">WHAT THE EVIDENCE SAYS</tspan></text><text x="58" y="374" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17171A" text-anchor="start"><tspan x="58" dy="0">Daily coffee is associated with an</tspan><tspan x="58" dy="21.75">18% lower incidence of heart</tspan><tspan x="58" dy="21.75">disease; the study is observational</tspan><tspan x="58" dy="21.75">and does not establish cause.</tspan></text><rect x="418" y="304" width="364" height="170" rx="14" fill="#FFFFFF" stroke="#DEDED8"/><rect x="418" y="304" width="364" height="4" rx="2" fill="#B7791F"/><text x="440" y="342" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#B7791F" text-anchor="start"><tspan x="440" dy="0">WHY IT DOES NOT FULLY MATCH</tspan></text><text x="440" y="374" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17171A" text-anchor="start"><tspan x="440" dy="0">The source describes an association;</tspan><tspan x="440" dy="21.75">the claim asserts proven cause.</tspan><tspan x="440" dy="21.75">Unsupported: that the study</tspan><tspan x="440" dy="21.75">proves causation.</tspan></text><rect x="800" y="304" width="364" height="170" rx="14" fill="#FFFFFF" stroke="#DEDED8"/><rect x="800" y="304" width="364" height="4" rx="2" fill="#E5502A"/><text x="822" y="342" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#E5502A" text-anchor="start"><tspan x="822" dy="0">SHOW ME WHY</tspan></text><text x="822" y="374" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17171A" text-anchor="start"><tspan x="822" dy="0">p.3 Limitations  ·  Conflicts</tspan><tspan x="822" dy="21.75">p.2 Results  ·  Supports (×2)</tspan><tspan x="822" dy="21.75">Open the source: page 3 opens</tspan><tspan x="822" dy="21.75">with the sentence highlighted.</tspan></text><g transform="translate(36 500) scale(0.9166666666666666)" fill="none" stroke="#1F8F5B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></g><text x="68" y="517" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5C5C66"><tspan x="68" dy="0"><tspan fill="#17171A" font-weight="700">What you can conclude: </tspan>coffee consumption is linked to a lower risk of heart disease, but the study does not prove that coffee causes it.</tspan></text></svg>
