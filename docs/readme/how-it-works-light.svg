<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="How ProofLens verifies a claim"><rect width="1200" height="470" rx="18" fill="#F7F7F5"/><text x="36" y="50" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E5502A" text-anchor="start"><tspan x="36" dy="0">HOW A CLAIM IS VERIFIED</tspan></text><text x="1164" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5C5C66" text-anchor="end"><tspan x="1164" dy="0">The backend owns the verdict</tspan></text><rect x="36" y="96" width="168" height="250" rx="14" fill="#FFFFFF" stroke="#DEDED8" stroke-width="1.2"/><circle cx="76" cy="138" r="22" fill="#FFF1EA"/><g transform="translate(64 126) scale(1.0)" fill="none" stroke="#E5502A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v10H9l-5 4z"/><path d="M8 10h8M8 13h5"/></g><text x="186" y="144" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5C5C66" text-anchor="end"><tspan x="186" dy="0">01</tspan></text><text x="54" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#17171A" text-anchor="start"><tspan x="54" dy="0">Claim</tspan></text><text x="54" y="230" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C5C66" text-anchor="start"><tspan x="54" dy="0">One plain statement.</tspan><tspan x="54" dy="19.5">Analysed for strength,</tspan><tspan x="54" dy="19.5">causation, numbers,</tspan><tspan x="54" dy="19.5">dates and names.</tspan></text><path d="M207 221h14" stroke="#E5502A" stroke-width="2" stroke-linecap="round"/><path d="M217 216l6 5-6 5" fill="none" stroke="#E5502A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="228" y="96" width="168" height="250" rx="14" fill="#FFFFFF" stroke="#DEDED8" stroke-width="1.2"/><circle cx="268" cy="138" r="22" fill="#FFF1EA"/><g transform="translate(256 126) scale(1.0)" fill="none" stroke="#E5502A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 15h6M9 18h4"/></g><text x="378" y="144" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5C5C66" text-anchor="end"><tspan x="378" dy="0">02</tspan></text><text x="246" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#17171A" text-anchor="start"><tspan x="246" dy="0">Evidence</tspan></text><text x="246" y="230" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C5C66" text-anchor="start"><tspan x="246" dy="0">PDF, TXT, MD or CSV.</tspan><tspan x="246" dy="19.5">Text extracted per page</tspan><tspan x="246" dy="19.5">in a sandboxed</tspan><tspan x="246" dy="19.5">subprocess.</tspan></text><path d="M399 221h14" stroke="#E5502A" stroke-width="2" stroke-linecap="round"/><path d="M409 216l6 5-6 5" fill="none" stroke="#E5502A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="96" width="168" height="250" rx="14" fill="#FFFFFF" stroke="#E5502A" stroke-width="1.6"/><circle cx="460" cy="138" r="22" fill="#FFF1EA"/><g transform="translate(448 126) scale(1.0)" fill="none" stroke="#E5502A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M7 20h10M5 7h14"/><path d="M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/></g><text x="570" y="144" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5C5C66" text-anchor="end"><tspan x="570" dy="0">03</tspan></text><text x="438" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#17171A" text-anchor="start"><tspan x="438" dy="0">Rule checks</tspan></text><text x="438" y="230" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C5C66" text-anchor="start"><tspan x="438" dy="0">Numbers, dates, names,</tspan><tspan x="438" dy="19.5">negation, causation</tspan><tspan x="438" dy="19.5">vs association,</tspan><tspan x="438" dy="19.5">absolute language.</tspan></text><path d="M591 221h14" stroke="#E5502A" stroke-width="2" stroke-linecap="round"/><path d="M601 216l6 5-6 5" fill="none" stroke="#E5502A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="612" y="96" width="168" height="250" rx="14" fill="#FFFFFF" stroke="#E5502A" stroke-width="1.6"/><circle cx="652" cy="138" r="22" fill="#FFF1EA"/><g transform="translate(640 126) scale(1.0)" fill="none" stroke="#E5502A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></g><text x="762" y="144" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5C5C66" text-anchor="end"><tspan x="762" dy="0">04</tspan></text><text x="630" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#17171A" text-anchor="start"><tspan x="630" dy="0">AI reasoning</tspan></text><text x="630" y="230" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C5C66" text-anchor="start"><tspan x="630" dy="0">Sees only your</tspan><tspan x="630" dy="19.5">passages. Must answer</tspan><tspan x="630" dy="19.5">in a strict JSON</tspan><tspan x="630" dy="19.5">schema.</tspan></text><path d="M783 221h14" stroke="#E5502A" stroke-width="2" stroke-linecap="round"/><path d="M793 216l6 5-6 5" fill="none" stroke="#E5502A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="804" y="96" width="168" height="250" rx="14" fill="#FFFFFF" stroke="#E5502A" stroke-width="1.6"/><circle cx="844" cy="138" r="22" fill="#FFF1EA"/><g transform="translate(832 126) scale(1.0)" fill="none" stroke="#E5502A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="954" y="144" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5C5C66" text-anchor="end"><tspan x="954" dy="0">05</tspan></text><text x="822" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#17171A" text-anchor="start"><tspan x="822" dy="0">Validation</tspan></text><text x="822" y="230" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C5C66" text-anchor="start"><tspan x="822" dy="0">Pydantic parsing.</tspan><tspan x="822" dy="19.5">Unknown refs dropped,</tspan><tspan x="822" dy="19.5">quotes must be verbatim,</tspan><tspan x="822" dy="19.5">conflicts override.</tspan></text><path d="M975 221h14" stroke="#E5502A" stroke-width="2" stroke-linecap="round"/><path d="M985 216l6 5-6 5" fill="none" stroke="#E5502A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="996" y="96" width="168" height="250" rx="14" fill="#FFFFFF" stroke="#DEDED8" stroke-width="1.2"/><circle cx="1036" cy="138" r="22" fill="#FFF1EA"/><g transform="translate(1024 126) scale(1.0)" fill="none" stroke="#E5502A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><circle cx="10.5" cy="10.5" r="2.2"/><path d="M15.5 15.5L21 21"/></g><text x="1146" y="144" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5C5C66" text-anchor="end"><tspan x="1146" dy="0">06</tspan></text><text x="1014" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#17171A" text-anchor="start"><tspan x="1014" dy="0">Show me why</tspan></text><text x="1014" y="230" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C5C66" text-anchor="start"><tspan x="1014" dy="0">Verdict, explanation,</tspan><tspan x="1014" dy="19.5">and the exact quote,</tspan><tspan x="1014" dy="19.5">document and page,</tspan><tspan x="1014" dy="19.5">highlighted.</tspan></text><rect x="36" y="376" width="1128" height="62" rx="12" fill="#F0F0EC"/><g transform="translate(58 395) scale(1.0)" fill="none" stroke="#B7791F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.3"/></g><text x="96" y="413" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5C5C66"><tspan x="96" dy="0"><tspan fill="#17171A" font-weight="700">If every AI model fails: </tspan>the rule result is returned only when it is decisive. Otherwise the API answers 503, stores nothing, and the person can retry.</tspan></text></svg>
