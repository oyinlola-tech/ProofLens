<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="The four verdicts"><rect width="1200" height="200" rx="18" fill="#111113"/><rect x="36" y="30" width="273" height="140" rx="14" fill="#1B1B1F" stroke="#33333A"/><circle cx="66" cy="64" r="7" fill="#3DD68C"/><text x="84" y="70" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F0EA" text-anchor="start"><tspan x="84" dy="0">Supported</tspan></text><text x="58" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9AA3" text-anchor="start"><tspan x="58" dy="0">The evidence directly supports</tspan><tspan x="58" dy="21.0">the essential proposition.</tspan></text><rect x="321" y="30" width="273" height="140" rx="14" fill="#1B1B1F" stroke="#33333A"/><circle cx="351" cy="64" r="7" fill="#F5B84A"/><text x="369" y="70" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F0EA" text-anchor="start"><tspan x="369" dy="0">Partially supported</tspan></text><text x="343" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9AA3" text-anchor="start"><tspan x="343" dy="0">Part is supported, or the claim</tspan><tspan x="343" dy="21.0">asserts more than the evidence.</tspan></text><rect x="606" y="30" width="273" height="140" rx="14" fill="#1B1B1F" stroke="#33333A"/><circle cx="636" cy="64" r="7" fill="#F05D5E"/><text x="654" y="70" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F0EA" text-anchor="start"><tspan x="654" dy="0">Contradicted</tspan></text><text x="628" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9AA3" text-anchor="start"><tspan x="628" dy="0">The evidence materially</tspan><tspan x="628" dy="21.0">conflicts with the claim.</tspan></text><rect x="891" y="30" width="273" height="140" rx="14" fill="#1B1B1F" stroke="#33333A"/><circle cx="921" cy="64" r="7" fill="#9A9AA3"/><text x="939" y="70" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F0EA" text-anchor="start"><tspan x="939" dy="0">Insufficient evidence</tspan></text><text x="913" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9A9AA3" text-anchor="start"><tspan x="913" dy="0">Not enough relevant evidence</tspan><tspan x="913" dy="21.0">to decide either way.</tspan></text></svg>
